name: Causal Ambiguity Reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - 'applications/causal_ambiguity/**'
      - '.github/workflows/causal-ambiguity-reproduce.yml'
  pull_request:
    paths:
      - 'applications/causal_ambiguity/**'
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r applications/causal_ambiguity/requirements.txt
      - run: python applications/causal_ambiguity/reproduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: causal-ambiguity-results
          path: |
            applications/causal_ambiguity/results
            applications/causal_ambiguity/reports
